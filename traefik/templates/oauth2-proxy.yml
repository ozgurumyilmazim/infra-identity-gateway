http:
  routers:
    oauth2-proxy:
      rule: "Host(`auth.icat.com.tr`)"
      entryPoints:
        - websecure
        - webexternalunsecure
        - webexternalsecure
      tls: {}
      service: oauth2-proxy
  services:
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"

  
  