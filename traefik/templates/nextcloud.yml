http:
  routers:
    # İç ağ erişimi (intra) – TLS zorunlu
    nextcloud-int:
      rule: "Host(`${NEXTCLOUD_DOMAIN_INT}` )"
      entryPoints:
        - "websecure"
      tls: {}
      service: nextcloud

    # Dış ağ erişimi (public) – TLS opsiyonel, CrowdSec koruması
    nextcloud-ext:
      rule: "Host(`${NEXTCLOUD_DOMAIN_EXT}` )"
      entryPoints:
        - "webexternalunsecure"
      middlewares:
        - "crowdsec@file"
      service: nextcloud

  services:
    nextcloud:
      loadBalancer:
        servers:
          - url: "${NEXTCLOUD_SCHEME}://${NEXTCLOUD_HOST}:${NEXTCLOUD_PORT}"