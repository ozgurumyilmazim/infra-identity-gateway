title = "infra-identity-gateway"

[extend]
# gitleaks'in varsayilan kurallarini kullan.
useDefault = true

# Bu proje .env tarzi ANAHTAR=deger dosyalari kullandigi icin, dusuk entropili
# parola/token degerlerini de yakalayan ek kural.
[[rules]]
id = "env-secret-assignment"
description = "env tarzi dosyada bos olmayan parola/token atamasi"
regex = '''(?i)^\s*[A-Z0-9_]*(?:PASSWORD|PASSWD|SECRET|TOKEN|API_KEY|AUTH_KEY)[A-Z0-9_]*\s*=\s*([A-Za-z0-9][^\r\n]*)'''
entropy = 2.5
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "api_key",
  "auth_key",
]

# Yer tutucu degerler icin yanlis pozitifleri engelle.
# DIKKAT: Ornek dosyalar (.ornek/.example) path olarak muaf tutulmaz; aksi halde
# icine yanlislikla yazilan gercek bir sir taramadan kacar.
[[allowlists]]
description = "Yer tutucu degerler"
regexTarget = "match"
regexes = [
  '''\$\{[A-Z0-9_]+\}''',
  '''<[A-Z0-9_]+>''',
]
